<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a8ccc8">
<title>Colony</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a8ccc8; overscroll-behavior: none; }
  body {
    font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  svg { display: block; }
  .sign { display: inline-block; width: 1.25em; height: 1.25em; flex: none; }
  .sign svg, [data-sign] > svg { width: 100%; height: 100%; }
  [data-sign] > svg { width: 22px; height: 22px; flex: none; }
  .panel { background: rgba(20, 28, 24, 0.55); border-radius: 12px; padding: 6px 10px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); }
  [hidden] { display: none !important; }

  /* The top of the screen: the name, the buttons, the spare bodies and the food. */
  #top { position: fixed; left: calc(10px + env(safe-area-inset-left)); right: calc(10px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); display: flex; align-items: flex-start; gap: 8px; pointer-events: none; z-index: 3; }
  #top > * { pointer-events: auto; }
  #me { display: flex; align-items: center; gap: 7px; min-width: 0; touch-action: manipulation; }
  #name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #swatch { flex: none; width: 12px; height: 12px; border-radius: 50%; }
  button { border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.6); color: #fff; font: 600 15px system-ui, sans-serif; background: rgba(20, 28, 24, 0.5); touch-action: none; padding: 0; outline: none; -webkit-appearance: none; appearance: none; }
  .tool { border-radius: 12px; border-width: 0; padding: 6px 8px; display: flex; align-items: center; gap: 6px; touch-action: manipulation; }
  #counts { margin-left: auto; display: flex; gap: 12px; align-items: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  #counts span { display: flex; align-items: center; gap: 5px; }
  #spare b, #food b { display: inline-block; min-width: 1.2em; text-align: right; }
  #spare.low { color: #ffc2b0; }
  #spare.none { color: #ff6a50; animation: flash 0.7s steps(2, jump-none) infinite; }
  #spare.used b { animation: drop 0.35s ease-out; }
  #food.more b { animation: rise 0.35s ease-out; }
  @keyframes flash { 50% { opacity: 0.25; } }
  @keyframes drop { 0% { transform: translateY(-7px) scale(1.35); color: #ffd76a; } 100% { transform: none; } }
  @keyframes rise { 0% { transform: translateY(6px) scale(1.3); color: #ffd76a; } 100% { transform: none; } }

  #stats { position: fixed; left: calc(10px + env(safe-area-inset-left)); top: calc(54px + env(safe-area-inset-top)); font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre; text-align: left; z-index: 3; }
  #status { position: fixed; left: 50%; top: 45%; width: 44px; height: 44px; margin: -22px 0 0 -22px; padding: 10px; box-sizing: border-box; animation: turn 1s linear infinite; }
  #status svg { width: 100%; height: 100%; }
  @keyframes turn { to { transform: rotate(360deg); } }

  /* Names and numbers above the picture. */
  #info { position: fixed; transform: translate(-50%, -125%); pointer-events: none; white-space: nowrap; text-align: center; font-size: 13px; }
  #info b { display: block; font-size: 15px; }
  #info span { display: inline-flex; align-items: center; gap: 4px; margin: 0 4px; }
  #labels div { position: fixed; transform: translate(-50%, -100%); pointer-events: none; font-size: 12px; white-space: nowrap; text-shadow: 0 1px 3px #000, 0 0 2px #000; }
  /* A helper is not a person: its name is grey, in a box. */
  #labels div.helper { font-size: 11px; color: #e6e9ec; background: rgba(70, 76, 84, 0.8); border: 1px dashed rgba(255, 255, 255, 0.55); border-radius: 4px; padding: 0 5px; text-shadow: none; }
  #labels div.pile { font-weight: 700; font-size: 14px; color: #ffd76a; display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
  #labels div.pile.loss { color: #ff7a5c; }
  #labels div.pile .sign { width: 16px; height: 16px; }
  #labels div.locked { font-weight: 600; font-size: 13px; transition: opacity 0.4s; }
  #labels div.oldnest { display: flex; align-items: center; gap: 3px; font-weight: 700; font-size: 13px; color: #e8dcc8; opacity: 0.85; }
  #labels div.oldnest .sign { width: 16px; height: 16px; }
  #you { position: fixed; width: 0; height: 0; margin: -16px 0 0 -8px; border: 8px solid transparent; border-top: 11px solid #fff; border-bottom: 0; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.7)); pointer-events: none; animation: bob 0.9s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-5px); } }

  /* The arrow at the edge of the screen. */
  #arrow { position: fixed; width: 54px; height: 54px; margin: -27px 0 0 -27px; pointer-events: none; z-index: 2; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.55)); }
  #arrow .point { position: absolute; inset: 0; color: #ffd76a; animation: push 0.8s ease-in-out infinite alternate; }
  #arrow .point svg { width: 100%; height: 100%; }
  #arrow .goal { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; color: #2a1c05; }
  #arrow .goal svg { width: 100%; height: 100%; }
  @keyframes push { to { transform: translateY(-6px); } }

  /* The record of a bridge: signs, numbers and names. */
  .record { background: rgba(20, 28, 24, 0.82); border-radius: 14px; padding: 10px 12px; margin: 0 auto 10px; max-width: 420px; font-variant-numeric: tabular-nums; }
  .record.mine { outline: 2px solid #ffd76a; }
  .record .head { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 16px; }
  .record .head span { display: flex; align-items: center; gap: 5px; }
  .record .head .river { font-size: 20px; }
  .record .head .left { margin-left: auto; }
  .record .head small { font-weight: 500; opacity: 0.75; font-size: 13px; margin-left: 3px; }
  .record ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  .record li { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .record li i.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .record li .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .record li .count { display: flex; align-items: center; gap: 3px; min-width: 44px; justify-content: flex-end; }
  .record li.helper { opacity: 0.7; }
  .record li.me { font-weight: 700; color: #ffe08a; }
  #card { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%); width: min(86%, 420px); pointer-events: none; z-index: 4; animation: show 0.4s ease-out; }
  #card .record { margin: 0; }
  @keyframes show { from { opacity: 0; transform: translate(-50%, -12px); } }

  /* Touch controls. */
  #zone { position: fixed; left: 0; bottom: 0; width: 50%; height: 46%; touch-action: none; }
  #stick {
    position: absolute; left: calc(84px + env(safe-area-inset-left)); top: calc(100% - 96px - env(safe-area-inset-bottom));
    width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.14); border: 2px solid rgba(255, 255, 255, 0.45); box-sizing: border-box; pointer-events: none;
  }
  #stick.held { background: rgba(255, 255, 255, 0.2); }
  #knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(255, 255, 255, 0.75); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); }
  #lock { position: fixed; right: calc(20px + env(safe-area-inset-right)); bottom: calc(40px + env(safe-area-inset-bottom)); width: 100px; height: 100px; opacity: 0.45; transition: opacity 0.15s, background 0.15s, transform 0.08s; display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 26px; font-variant-numeric: tabular-nums; }
  #lock svg { width: 62px; height: 40px; }
  /* The states of the button: see main.js. */
  #lock.state-lock { opacity: 1; background: rgba(242, 178, 38, 0.95); border-color: #fff; color: #2a1c05; box-shadow: 0 0 0 0 rgba(255, 220, 120, 0.9); animation: pulse 1.1s infinite; }
  #lock.state-food { opacity: 1; background: rgba(60, 46, 20, 0.75); border-color: #ffd76a; }
  #lock.state-food svg { width: 52px; height: 52px; }
  #lock.state-none { opacity: 1; color: #ff6a50; border-color: #ff6a50; background: rgba(60, 14, 8, 0.6); animation: flash 1.4s ease-in-out infinite; }
  #lock.state-none svg { width: 38px; height: 38px; }
  #lock.state-rest { opacity: 0.95; }
  #lock.state-rest svg { width: 64px; height: 64px; }
  #lock.state-wait { opacity: 0.7; }
  #lock.state-wait svg { width: 44px; height: 44px; animation: turn 2.2s linear infinite; }
  #lock.tap { transform: scale(0.9); }
  #lock.no { animation: shake 0.3s; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 220, 120, 0.9); } 100% { box-shadow: 0 0 0 16px rgba(255, 220, 120, 0); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #keys { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 13px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  #keys kbd { font: inherit; background: rgba(255, 255, 255, 0.2); border-radius: 4px; padding: 1px 6px; }
  #keys .sign { width: 18px; height: 18px; margin-right: 10px; }
  #keys .sign:last-child { width: 30px; margin-right: 0; }
  body.keys #zone, body.keys #lock { display: none; }
  body.touch #keys { display: none; }
  body.look #zone, body.look #lock, body.look #keys, body.look #me, body.look #you, body.look #arrow { display: none; }

  /* The story: the bodies appear, then the world from above with the names. */
  body.story #zone, body.story #lock, body.story #keys, body.story #you, body.story #arrow, body.story #top, body.story #card, body.story #info, body.story #stats { display: none !important; }
  #storyTools { position: fixed; right: calc(10px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); display: flex; gap: 8px; z-index: 6; }
  #storyTools button { width: 44px; height: 44px; border-radius: 12px; border-width: 0; background: rgba(20, 28, 24, 0.7); display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  #storyTools button svg { width: 24px; height: 24px; }
  #storyCount { position: fixed; left: calc(12px + env(safe-area-inset-left)); top: calc(12px + env(safe-area-inset-top)); z-index: 6; display: flex; align-items: center; gap: 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #storyCount .sign { width: 20px; height: 20px; }
  #storyButton.news { animation: news 1s ease-in-out 7; }
  @keyframes news { 50% { background: rgba(255, 205, 90, 0.9); box-shadow: 0 0 0 5px rgba(255, 220, 120, 0.45); } }
  #storyEnd { position: fixed; left: 0; right: 0; bottom: 0; max-height: 38%; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; background: linear-gradient(rgba(14, 22, 19, 0), rgba(14, 22, 19, 0.88) 26px); padding: 34px 14px calc(12px + env(safe-area-inset-bottom)); z-index: 5; animation: show2 0.6s ease-out; }
  @keyframes show2 { from { opacity: 0; } }
  #storyHead { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; margin: 0 auto 8px; max-width: 420px; }
  #storyHead span { display: flex; align-items: center; gap: 5px; }
  #storyHead .date { margin-left: auto; font-weight: 500; font-size: 13px; opacity: 0.8; }
  #storyNames { list-style: none; margin: 0 auto 10px; padding: 0; max-width: 420px; display: grid; grid-template-columns: 1fr; gap: 3px 14px; font-size: 13px; font-variant-numeric: tabular-nums; }
  #storyNames li { display: flex; align-items: center; gap: 5px; min-width: 0; }
  #storyNames li i.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  #storyNames li .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #storyNames li .count { display: flex; align-items: center; gap: 2px; }
  #storyNames li .sign { width: 14px; height: 14px; }
  #storyNames li.helper { opacity: 0.7; }
  #storyNames li.me { font-weight: 700; color: #ffe08a; }
</style>
</head>
<body class="keys">
<canvas id="view"></canvas>
<div id="labels"></div>
<div id="you" hidden></div>
<div id="arrow" hidden><div class="point" id="arrowPoint"></div><div class="goal" id="arrowGoal"></div></div>
<div id="top" hidden>
  <div id="me" class="panel"><span id="swatch"></span><span id="name"></span></div>
  <button id="storyButton" class="tool" type="button" data-sign="story"></button>
  <button id="soundButton" class="tool" type="button" data-sign="soundOn"></button>
  <div id="counts" class="panel">
    <span id="spare" data-sign="body"><b id="spareCount">0</b></span>
    <span id="food" data-sign="food"><b id="foodCount">0</b></span>
  </div>
</div>
<div id="stats" class="panel" hidden></div>
<div id="card" hidden></div>
<div id="info" class="panel" hidden></div>
<div id="zone"><div id="stick"><div id="knob"></div></div></div>
<button id="lock" type="button" data-sign="lock"></button>
<div id="keys" class="panel"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><i class="sign" data-sign="move"></i><kbd>Space</kbd><i class="sign" data-sign="lock"></i></div>
<div id="status" class="panel" data-sign="wait"></div>
<div id="storyCount" class="panel" hidden><i class="sign" data-sign="body"></i><span id="storyShown">0</span></div>
<div id="storyTools" hidden>
  <button id="storySave" type="button" data-sign="save" hidden></button>
  <button id="storyAgain" type="button" data-sign="again" hidden></button>
  <button id="storyClose" type="button" data-sign="close"></button>
</div>
<div id="storyEnd" hidden>
  <div id="storyHead"></div>
  <ul id="storyNames"></ul>
  <div id="storyRecords"></div>
</div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
