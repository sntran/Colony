<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a8c7cc">
<title>Colony</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a8c7cc; overscroll-behavior: none; }
  body {
    font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { background: rgba(20, 28, 24, 0.55); border-radius: 12px; padding: 6px 10px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); }
  #top { position: fixed; left: calc(10px + env(safe-area-inset-left)); right: calc(10px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); display: flex; align-items: flex-start; gap: 8px; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #me { display: flex; align-items: center; gap: 7px; min-width: 0; }
  #name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #swatch { flex: none; width: 12px; height: 12px; border-radius: 50%; }
  #counts { margin-left: auto; display: flex; gap: 12px; align-items: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  #counts span { display: flex; align-items: center; gap: 5px; }
  #counts svg { width: 22px; height: 22px; flex: none; }
  #workers.low { color: #ffb0a0; }
  #stats { position: fixed; left: calc(10px + env(safe-area-inset-left)); top: calc(54px + env(safe-area-inset-top)); font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre; text-align: left; }
  #banner { position: fixed; left: 50%; top: 20%; transform: translateX(-50%); font-size: 18px; font-weight: 600; padding: 10px 18px; text-align: center; pointer-events: none; max-width: 86%; }
  #status { position: fixed; left: 50%; top: 45%; transform: translateX(-50%); padding: 10px 16px; text-align: center; max-width: 80%; }
  #info { position: fixed; transform: translate(-50%, -125%); pointer-events: none; white-space: nowrap; text-align: center; font-size: 13px; }
  #info b { display: block; font-size: 15px; }
  #labels div { position: fixed; transform: translate(-50%, -100%); pointer-events: none; font-size: 12px; white-space: nowrap; text-shadow: 0 1px 3px #000, 0 0 2px #000; }
  /* A helper is not a person: its name is grey, in a box. */
  #labels div.helper { font-size: 11px; color: #e6e9ec; background: rgba(70, 76, 84, 0.8); border: 1px dashed rgba(255, 255, 255, 0.55); border-radius: 4px; padding: 0 5px; text-shadow: none; }
  #labels div.pile { font-weight: 700; font-size: 14px; color: #ffd76a; display: flex; align-items: center; gap: 4px; }
  #labels div.pile svg { width: 16px; height: 16px; }
  #you { position: fixed; width: 0; height: 0; margin: -16px 0 0 -8px; border: 8px solid transparent; border-top: 11px solid #fff; border-bottom: 0; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.7)); pointer-events: none; animation: bob 0.9s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-5px); } }
  [hidden] { display: none !important; }

  /* The records of the bridges. */
  button { border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.6); color: #fff; font: 600 15px system-ui, sans-serif; background: rgba(20, 28, 24, 0.5); touch-action: none; padding: 0; outline: none; -webkit-appearance: none; appearance: none; }
  #open { border-radius: 12px; border-width: 0; padding: 6px 10px; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; touch-action: manipulation; }
  #open svg { width: 20px; height: 20px; }
  #records { position: fixed; inset: 0; background: rgba(10, 16, 14, 0.94); overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(16px + env(safe-area-inset-top)) 16px 24px; z-index: 5; user-select: text; -webkit-user-select: text; }
  #records h1 { font-size: 20px; margin: 0 48px 12px 0; }
  #close { position: fixed; right: calc(14px + env(safe-area-inset-right)); top: calc(12px + env(safe-area-inset-top)); width: 40px; height: 40px; font-size: 20px; touch-action: manipulation; }
  .record { background: rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 10px 12px; margin: 0 auto 10px; max-width: 520px; }
  .record.mine { outline: 2px solid #ffd76a; }
  .record h2 { font-size: 16px; margin: 0 0 4px; }
  .record p { margin: 2px 0; opacity: 0.85; font-size: 13px; }
  .record ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 6px; }
  .record li { background: rgba(255, 255, 255, 0.14); border-radius: 10px; padding: 1px 8px; font-size: 13px; display: flex; align-items: center; gap: 5px; }
  .record li i { width: 9px; height: 9px; border-radius: 50%; }
  .record li.helper { opacity: 0.75; border: 1px dashed rgba(255, 255, 255, 0.5); background: none; }
  .record li.me { font-weight: 700; background: rgba(255, 215, 106, 0.3); }
  #card { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%); width: min(86%, 420px); pointer-events: none; z-index: 4; }
  #card .record { margin: 0; background: rgba(20, 28, 24, 0.8); }
  #empty { opacity: 0.8; max-width: 520px; margin: 0 auto; }

  /* Touch controls. */
  #zone { position: fixed; left: 0; bottom: 0; width: 50%; height: 46%; touch-action: none; }
  #stick {
    position: absolute; left: calc(84px + env(safe-area-inset-left)); top: calc(100% - 96px - env(safe-area-inset-bottom));
    width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.14); border: 2px solid rgba(255, 255, 255, 0.45); box-sizing: border-box; pointer-events: none;
  }
  #stick.held { background: rgba(255, 255, 255, 0.2); }
  #knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(255, 255, 255, 0.75); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); }
  #lock, #scent { position: fixed; }
  #lock { right: calc(18px + env(safe-area-inset-right)); bottom: calc(40px + env(safe-area-inset-bottom)); width: 92px; height: 92px; font-size: 18px; opacity: 0.55; transition: opacity 0.15s, background 0.15s, box-shadow 0.15s; }
  #lock.ready { opacity: 1; background: rgba(242, 178, 38, 0.92); border-color: #fff; color: #2a1c05; box-shadow: 0 0 0 0 rgba(255, 220, 120, 0.9); animation: pulse 1.1s infinite; }
  #lock.no { animation: shake 0.3s; }
  #scent { right: calc(118px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom)); width: 70px; height: 70px; }
  #scent.held { background: rgba(214, 94, 255, 0.9); border-color: #fff; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 220, 120, 0.9); } 100% { box-shadow: 0 0 0 16px rgba(255, 220, 120, 0); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #keys { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 13px; white-space: nowrap; }
  #keys kbd { font: inherit; background: rgba(255, 255, 255, 0.2); border-radius: 4px; padding: 1px 6px; margin: 0 1px; }
  body.keys #zone, body.keys #lock, body.keys #scent { display: none; }
  body.touch #keys { display: none; }
  body.demo #zone, body.demo #lock, body.demo #scent, body.demo #keys, body.demo #me { display: none; }
</style>
</head>
<body class="keys">
<canvas id="view"></canvas>
<div id="labels"></div>
<div id="you" hidden></div>
<div id="top" hidden>
  <div id="me" class="panel"><span id="swatch"></span><span id="name"></span></div>
  <button id="open" type="button" title="The records of the bridges">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 15c3-7 15-7 18 0"/><path d="M6 12v5M10 10.4V17M14 10.4V17M18 12v5"/></svg>
    <span id="recordCount">0</span>
  </button>
  <div id="counts" class="panel">
    <!-- The free workers: the bodies that the colony can still use. -->
    <span id="workers" title="Free workers: the bodies that the colony can still use">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><ellipse cx="12" cy="5.2" rx="2.6" ry="2.4"/><ellipse cx="12" cy="11" rx="2.2" ry="2.6"/><ellipse cx="12" cy="18" rx="3.6" ry="4.4"/><path fill="none" d="M10 9.5 5 7M14 9.5l5-2.5M9.8 11H4.5M14.2 11h5.3M10 12.6 5.5 16M14 12.6l4.5 3.4"/></svg>
      <span id="workerCount">0</span>
    </span>
    <span id="food" title="Food at the nest">
      <svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="5" fill="#ffbd33"/><circle cx="16" cy="15.5" r="4.4" fill="#ffc94d"/><circle cx="12.5" cy="8.5" r="4.6" fill="#ffd76a"/></svg>
      <span id="foodCount">0</span>
    </span>
  </div>
</div>
<div id="stats" class="panel" hidden></div>
<div id="banner" class="panel" hidden></div>
<div id="card" hidden></div>
<div id="info" class="panel" hidden></div>
<div id="zone"><div id="stick"><div id="knob"></div></div></div>
<button id="scent" type="button">Scent</button>
<button id="lock" type="button">Lock</button>
<div id="keys" class="panel"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp; <kbd>Space</kbd> lock &nbsp; <kbd>Shift</kbd> scent</div>
<div id="status" class="panel">The page connects to the server.</div>
<div id="records" hidden>
  <button id="close" type="button" title="Close">×</button>
  <h1>The records of the bridges</h1>
  <p id="empty">There is no record. The first food that gets to the nest across a bridge makes one.</p>
  <div id="list"></div>
</div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
