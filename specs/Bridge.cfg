\* A small river, for a check of all the states: 3 cells wide and 3 rows.
\* The bank support is 2. A bridge one body wide stops at 1 row, and a bridge
\* two bodies wide crosses, as the numbers of the plan do for 7 and 15 rows.
CONSTANTS
    Width = 3
    NearRows = 1
    FarRows = 1
    Bank = 24
    River <- SmallRiver
    Costs <- PlanCosts
SPECIFICATION BridgeSpec
INVARIANTS
    BridgeTypeOK
    AllSupported
    SupportOnlyGrows
    LockKeepsAll
    BodyBesideHelps
PROPERTIES
    BodiesStay
CHECK_DEADLOCK FALSE
