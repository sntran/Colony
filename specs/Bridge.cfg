\* A small river, for a check of the support rule in all the structures: 3 cells wide
\* and 3 rows. The bank support is 2. A body locks into each cell where it has
\* support, open or not. The module BridgeOpen has the model of the open cells.
CONSTANTS
    Width = 3
    NearRows = 1
    FarRows = 1
    Bank = 24
    River <- SmallRiver
    Costs <- PlanCosts
    StartCols = {0, 1, 2}
SPECIFICATION SupportSpec
INVARIANTS
    BridgeTypeOK
    AllSupported
    SupportOnlyGrows
    LockKeepsAll
    BodyBesideHelps
    OpenHasSupport
PROPERTIES
    BodiesStay
CHECK_DEADLOCK FALSE
