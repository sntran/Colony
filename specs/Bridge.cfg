\* A small gap, for a check of all the states: 2 cells wide and 3 rows.
\* The bank support is 2.0. A bridge one cell wide stops at 1 row, and a bridge
\* two cells wide crosses, as the numbers of the plan do for 7 and 12 rows.
CONSTANTS
    Width = 2
    NearRows = 1
    GapRows = 3
    FarRows = 1
    Bank = 4
    Alone = 2
    Beside = 1
    MaxLetGo = 2
SPECIFICATION BridgeSpec
INVARIANTS
    BridgeTypeOK
    AllSupported
    EstimateIsExact
    LockKeepsAll
    SupportOnlyGrows
PROPERTIES
    PlayerBodiesOnlyFall
    LockRemovesNothing
CHECK_DEADLOCK FALSE
