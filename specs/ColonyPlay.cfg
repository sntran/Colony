\* The world of the monitor test: a river 6 cells wide and 3 rows, with two players.
\* The test makes the real world from these numbers. The checker does not look at
\* all the states of this config: there are too many.
CONSTANTS
    Width = 6
    NearRows = 1
    FarRows = 4
    Bank = 24
    River <- SixColumns
    Costs <- PlanCosts
    Players = {"p1", "p2"}
    Nest = 2
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AllSupported
    FreeBodiesOnGround
    NoBodyNoPlace
