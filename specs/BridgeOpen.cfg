\* A river 4 cells wide and 3 rows. The bank support is 2: a bridge one body wide
\* stops at 1 row, as it does at 7 rows with the numbers of the plan. Thus each
\* bridge is: one body, one body beside it, then 2 rows forward. That is 4 bodies.
CONSTANTS
    Width = 4
    NearRows = 1
    FarRows = 1
    Bank = 24
    River <- FourRiver
    Costs <- PlanCosts
    StartCols = {1, 2}
SPECIFICATION BridgeSpec
INVARIANTS
    BridgeTypeOK
    AllSupported
    LockKeepsAll
    OpenHasSupport
    OpenIsNear
    OneBridge
    NeverStuck
    FourBodies
PROPERTIES
    BodiesStay
    CompleteTakesNoMore
    ForwardFirst
CHECK_DEADLOCK FALSE
