\* The bank support is 1.5. A bridge one body wide and a bridge two bodies wide
\* stop before the far bank. A bridge three bodies wide crosses.
CONSTANTS
    Width = 4
    NearRows = 1
    FarRows = 1
    Bank = 18
    River <- BentRiver
    Costs <- PlanCosts
SPECIFICATION BridgeSpec
INVARIANTS
    BridgeTypeOK
    AllSupported
    SupportOnlyGrows
    LockKeepsAll
    BodyBesideHelps
PROPERTIES
    BodiesStay
CHECK_DEADLOCK FALSE
