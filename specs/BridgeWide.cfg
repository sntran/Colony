\* The bank support is 1.5. A bridge one body wide and a bridge two bodies wide
\* stop before the far bank. A bridge three bodies wide crosses. A body locks into
\* each cell where it has support, open or not.
CONSTANTS
    Width = 4
    NearRows = 1
    FarRows = 1
    Bank = 18
    River <- BentRiver
    Costs <- PlanCosts
    StartCols = {0, 1, 2, 3}
SPECIFICATION SupportSpec
INVARIANTS
    BridgeTypeOK
    AllSupported
    SupportOnlyGrows
    LockKeepsAll
    BodyBesideHelps
    OpenHasSupport
PROPERTIES
    BodiesStay
CHECK_DEADLOCK FALSE
