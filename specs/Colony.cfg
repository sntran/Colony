\* A small world, for a check of all the states: a river 2 cells wide and 3 rows,
\* and one player. The bank support is 2: a bridge one body wide stops at 1 row.
CONSTANTS
    Width = 2
    NearRows = 1
    FarRows = 1
    Bank = 24
    River <- TwoColumns
    Costs <- PlanCosts
    Players = {"p1"}
    Nest = 0
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AllSupported
    FreeBodiesOnGround
    NoBodyNoPlace
    LockKeepsAll
PROPERTIES
    AllBodiesStay
    BodyLostByLock
    NewBodyAtNest
    TakenBodyRests
