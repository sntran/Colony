\* A small world, for a check of all the states: a river 2 cells wide and 3 rows,
\* one player, and 0, 1 or 2 workers at the start. The bank support is 2: a bridge one body
\* wide stops at 1 row.
CONSTANTS
    Width = 2
    NearRows = 1
    FarRows = 1
    Bank = 24
    River <- TwoColumns
    Costs <- PlanCosts
    StartCols = {0, 1}
    Players = {"p1"}
    Nest = 0
    Workers = 2
    MaxSpare = 2
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AllSupported
    FreeBodiesOnGround
    NoBodyNoPlace
    LockKeepsAll
    OneBridge
PROPERTIES
    AllBodiesStay
    LockUsesSpare
    LockOnlyOpen
    PlayerKeepsBody
    NewBodyAtNest
    TakenBodyRests
