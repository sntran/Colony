\* A small world, for a check of all the states: a gap 2 cells wide and 3 rows,
\* and one player. The numbers are the numbers of Bridge.cfg.
CONSTANTS
    Width = 2
    NearRows = 1
    GapRows = 3
    FarRows = 1
    Bank = 4
    Alone = 2
    Beside = 1
    MaxLetGo = 1
    Players = {"p1"}
    Nest = 0
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AllSupported
    FreeBodiesOnGround
    EstimateIsExact
    LockKeepsAll
PROPERTIES
    PlayerBodiesOnlyFall
    LockRemovesNothing
    BodyLostByLockOrFall
    NewBodyAtNest
