\* The numbers of the plans: bank support 96, costs 12, 6, 4 and 3.
\* The grid is 2 cells wide and the river is 9 rows.
CONSTANTS
    Width = 2
    NearRows = 1
    FarRows = 1
    Bank = 96
    River <- NineRows
    Costs <- PlanCosts
    StartCols = {0}
SPECIFICATION BridgeSpec
INVARIANTS
    BridgeTypeOK
    AllSupported
    OneBridge
    NeverStuck
    TenBodies
PROPERTIES
    ForwardFirst
    CompleteTakesNoMore
CHECK_DEADLOCK FALSE
