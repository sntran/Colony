# A play session: the game server on a runner, behind a quick tunnel of
# Cloudflare. Start this workflow by hand. The summary of the job has the
# address. Give the address to the players.
#
# The job gets no secret. At its end, it saves the world file and the
# records of the bridges as an artifact.
name: Play session

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How long the server runs (120 or fewer)
        type: number
        default: 60
      workers:
        description: The number of workers at the start
        type: number
        default: 30
      helpers:
        description: The number of helpers
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: play-session-${{ github.ref }}
  cancel-in-progress: true

jobs:
  play:
    name: Play for ${{ inputs.minutes }} minutes
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run the server and the tunnel
        env:
          MINUTES: ${{ inputs.minutes }}
          WORKERS: ${{ inputs.workers }}
          HELPERS: ${{ inputs.helpers }}
        run: sh scripts/play_session.sh
      - name: Save the world file and the records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: play-session-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/session/world.bin
            ${{ runner.temp }}/session/records.json
            ${{ runner.temp }}/session/server.log
          if-no-files-found: warn
